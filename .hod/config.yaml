# Hodstack Configuration for Reel2Trip
project:
  name: reel2trip
  description: Instagram Reel Place Extraction & Trip Planning
  version: 1.0.0

agents:
  supported: [claude, claude-code, cursor]
  required_knowledge: [laravel-13, php-8.3, vue-3, filament-4, queue-systems]

skills:
  directory: .hod/skills
  auto_load: true
  available: [queue-process, place-enrich, test-suite, db-migrate, filament-crud, dev-setup]

paths:
  root: ./
  src: app/
  models: app/Models/
  jobs: app/Jobs/
  migrations: database/migrations/
  tests: tests/

stack:
  framework: laravel-13
  database: sqlite
  queue: database
  ai_backend: ollama
  transcription: whisper.cpp

quality:
  php_standard: psr-12
  min_coverage: 80
  tools: [larastan, pint, phpunit, pest]
